<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIVOCI AI Live Analyzer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101c;color:#eef8ff;font-family:Arial;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:18px}.top,.card{background:#081624eF;border:1px solid #55d9ff2b;border-radius:20px;box-shadow:0 18px 55px #0008}.top{padding:16px;display:flex;justify-content:space-between}.logo{font-weight:900;letter-spacing:2px;font-size:21px}.logo span{color:#55d9ff}.badge{font-size:10px;color:#55e3b4;border:1px solid #55e3b455;border-radius:99px;padding:7px}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:15px;margin-top:15px}.card{padding:17px}h3{font-size:13px;letter-spacing:1px;margin:0 0 12px}.chart{height:390px}.chart canvas{width:100%;height:100%}.line{display:flex;justify-content:space-between;color:#829bac;font-size:11px}.signal{text-align:center;padding:23px;border-radius:17px;background:#020b14;border:1px solid #55d9ff20}.big{font-size:38px;font-weight:900}.wait{color:#91a9b8}.up{color:#52e1b0}.down{color:#ff617e}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.stat{padding:11px;background:#fff1;border-radius:12px;font-size:10px;color:#829bac}.stat b{display:block;color:#eef8ff;font-size:13px;margin-top:4px}.controls{display:flex;gap:9px;margin-top:14px}button{flex:1;padding:13px;border:0;border-radius:13px;color:white;font-weight:900}.start{background:#087fca}.pause{background:#9d2343}.note{font-size:10px;color:#718c9e;line-height:1.6;margin-top:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.chart{height:300px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">CIVOCI <span>AI</span></div><div class="badge" id="feed">CONNECTING...</div></div>
<div class="grid"><section class="card"><h3>LIVE MARKET — BTCUSDT</h3><div class="chart"><canvas id="cv"></canvas></div><div class="line"><span id="src">Backend → Binance market stream</span><span id="time">--</span></div></section>
<section class="card"><h3>AI SIGNAL</h3><div class="signal"><div id="sig" class="big wait">WAIT</div><div id="why" class="note">Start analysis to process live candles.</div></div>
<div class="stats"><div class="stat">PRICE<b id="price">—</b></div><div class="stat">TREND<b id="trend">—</b></div><div class="stat">MOMENTUM<b id="mom">—</b></div><div class="stat">CONFIDENCE<b id="conf">—</b></div></div>
<div class="controls"><button class="start" id="start">START</button><button class="pause" id="pause">PAUSE</button></div><div class="note">Live market data only. Signal is an experimental indicator, not a guaranteed prediction. No trade is placed.</div></section></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let candles=[],active=false,ws;
function fit(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){let w=cv.clientWidth,h=cv.clientHeight;if(!candles.length)return;let mn=Math.min(...candles.map(z=>z.l)),mx=Math.max(...candles.map(z=>z.h)),dy=mx-mn||1,dx=w/candles.length,y=v=>h-(v-mn)/dy*h;x=ctx;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#ffffff12';for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(0,h*i/6);ctx.lineTo(w,h*i/6);ctx.stroke()}candles.forEach((z,i)=>{let xx=i*dx+dx/2,col=z.c>=z.o?'#52dfb0':'#ff617e';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(xx,y(z.h));ctx.lineTo(xx,y(z.l));ctx.stroke();ctx.fillRect(xx-dx*.3,Math.min(y(z.o),y(z.c)),Math.max(2,dx*.6),Math.max(2,Math.abs(y(z.c)-y(z.o))))})}
function analyze(){if(candles.length<15)return;let p=candles.at(-1).c,sma=n=>candles.slice(-n).reduce((a,z)=>a+z.c,0)/n,f=sma(5),s=sma(14),m=p-candles.at(-2).c,sg='NO SIGNAL',cl='wait';if(f>s&&m>0)sg='UP',cl='up';else if(f<s&&m<0)sg='DOWN',cl='down';document.getElementById('sig').textContent=sg;document.getElementById('sig').className='big '+cl;document.getElementById('price').textContent=p.toFixed(2);document.getElementById('trend').textContent=f>s?'BULLISH':f<s?'BEARISH':'FLAT';document.getElementById('mom').textContent=m>=0?'POSITIVE':'NEGATIVE';document.getElementById('conf').textContent=sg==='NO SIGNAL'?'—':Math.min(92,55+Math.round(Math.abs(f-s)/p*7000))+'%';document.getElementById('why').textContent=sg==='UP'?'Short-term trend and latest momentum are positive.':sg==='DOWN'?'Short-term trend and latest momentum are negative.':'Conditions are mixed; CIVOCI waits.'}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{document.getElementById('feed').textContent='LIVE FEED CONNECTED'};ws.onclose=()=>{document.getElementById('feed').textContent='FEED DISCONNECTED';setTimeout(connect,2500)};ws.onmessage=e=>{let z=JSON.parse(e.data);if(z.type==='candle'){let k=z.data;candles.push({o:+k.o,h:+k.h,l:+k.l,c:+k.c});if(candles.length>60)candles.shift();draw();if(active)analyze();document.getElementById('time').textContent=new Date().toLocaleTimeString()}}}
document.getElementById('start').onclick=()=>{active=true;analyze()};document.getElementById('pause').onclick=()=>{active=false;document.getElementById('sig').textContent='PAUSED';document.getElementById('sig').className='big wait'};fit();addEventListener('resize',fit);connect();
</script></body></html>
